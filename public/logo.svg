<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- =========================================================================
       LOGO WEB APP: ÔN THI SÁT HẠCH GPLX 600 CÂU
       Biểu tượng chủ đạo: Tia Sét (Thi Nhanh) kết hợp phối cảnh làn đường (GPLX)
       Dễ dàng chỉnh sửa màu sắc trong thẻ <defs> hoặc bật/tắt các layer <g id="...">
       ========================================================================= -->

  <defs>
    <!-- 1. Gradient Nền Đậm Hiện Đại (Chế độ Dark/Tech) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- 2. Viền Neon Tinh Tế (Border Rim Glow) -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.7" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.6" />
    </linearGradient>

    <!-- 3. Quầng Sáng Tỏa Trung Tâm (Center Ambient Glow) -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>

    <!-- 4. Gradient Phối Cảnh Làn Đường (Road Surface & Guides) -->
    <linearGradient id="road-surface" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="road-lane-left" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="road-lane-right" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2" />
    </linearGradient>

    <!-- 5. Gradient Tia Sét (Electric Yellow / Amber / Gold) -->
    <linearGradient id="bolt-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Mặt sáng tia sét (Facet ánh sáng 3D) -->
    <linearGradient id="bolt-light-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Mặt tối tia sét (Facet bóng đổ 3D) -->
    <linearGradient id="bolt-dark-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Gradient Hạt Năng Lượng / Tia Lửa Nhỏ -->
    <linearGradient id="accent-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 6. Bộ Lọc Đổ Bóng & Hiệu Ứng Phát Sáng (Filters) -->
    <filter id="bolt-neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- ==========================================
       LAYER 1: KHUNG NỀN SQUIRCLE BIỂU TƯỢNG APP
       ========================================== -->
  <g id="app-container">
    <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" />
    <!-- Quầng hào quang trung tâm -->
    <circle cx="256" cy="256" r="210" fill="url(#center-glow)" />
    <!-- Viền Squircle -->
    <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#border-grad)" stroke-width="3.5" />
  </g>

  <!-- ==========================================
       LAYER 2: PHỐI CẢNH CON ĐƯỜNG GIAO THÔNG (GPLX)
       ========================================== -->
  <g id="road-perspective">
    <!-- Mặt đường xa dần về chân trời -->
    <path d="M 120 460 L 222 230 L 290 230 L 392 460 Z" fill="url(#road-surface)" />
    
    <!-- 2 Làn ranh giới đường phát sáng Neon -->
    <line x1="120" y1="460" x2="222" y2="230" stroke="url(#road-lane-left)" stroke-width="5" stroke-linecap="round" />
    <line x1="392" y1="460" x2="290" y2="230" stroke="url(#road-lane-right)" stroke-width="5" stroke-linecap="round" />
    
    <!-- Vạch kẻ tim đường (Vạch đứt giao thông chuẩn quy chuẩn) -->
    <line x1="256" y1="440" x2="256" y2="395" stroke="#FDE047" stroke-width="6" stroke-linecap="round" opacity="0.9" />
    <line x1="256" y1="370" x2="256" y2="335" stroke="#FDE047" stroke-width="5" stroke-linecap="round" opacity="0.75" />
    <line x1="256" y1="315" x2="256" y2="290" stroke="#FDE047" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <line x1="256" y1="275" x2="256" y2="255" stroke="#FDE047" stroke-width="3" stroke-linecap="round" opacity="0.45" />
    <line x1="256" y1="245" x2="256" y2="232" stroke="#FDE047" stroke-width="2" stroke-linecap="round" opacity="0.3" />
  </g>

  <!-- ==========================================
       LAYER 3: VÒNG TỐC ĐỘ VĂN HOA (SPEED ARCS)
       ========================================== -->
  <g id="speed-arcs" opacity="0.4">
    <path d="M 70 310 C 70 190 150 90 256 90" fill="none" stroke="#6366F1" stroke-width="2.5" stroke-dasharray="10 15" stroke-linecap="round" />
    <path d="M 442 310 C 442 190 362 90 256 90" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="10 15" stroke-linecap="round" />
  </g>

  <!-- ==========================================
       LAYER 4: QUẦNG SÁNG NEON TIA SÉT (AURA GLOW)
       ========================================== -->
  <g id="lightning-aura" filter="url(#bolt-neon)" opacity="0.85">
    <path d="M 284 64 L 168 256 L 254 242 L 228 448 L 344 218 L 264 230 Z" fill="url(#bolt-glow-grad)" opacity="0.6" />
  </g>

  <!-- ==========================================
       LAYER 5: TIA SÉT CHỦ ĐẠO (3D LIGHTNING BOLT)
       ========================================== -->
  <g id="lightning-bolt" filter="url(#drop-shadow)">
    <!-- Toàn bộ khối tia sét (Mặt tối cơ sở) -->
    <path d="M 284 64 L 168 256 L 254 242 L 228 448 L 344 218 L 264 230 Z" 
          fill="url(#bolt-dark-facet)" 
          stroke="#FEF08A" 
          stroke-width="2" 
          stroke-linejoin="round" />

    <!-- Mặt vát sáng 3D bên trái (Tạo chiều sâu đa diện sắc nét) -->
    <path d="M 284 64 L 168 256 L 254 242 L 228 448 Z" 
          fill="url(#bolt-light-facet)" />

    <!-- Đường gân phản quang giữa sống tia sét -->
    <line x1="284" y1="64" x2="254" y2="242" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    <line x1="254" y1="242" x2="228" y2="448" stroke="#FFF7ED" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- ==========================================
       LAYER 6: TIA LỬA NĂNG LƯỢNG & PHẢN XẠ NHANH
       ========================================== -->
  <g id="sparks-and-energy">
    <!-- Tia năng lượng góc trên phải -->
    <polygon points="342,108 350,124 366,132 350,140 342,156 334,140 318,132 334,124" fill="url(#accent-spark)" />
    <!-- Tia năng lượng phụ bên góc dưới trái -->
    <polygon points="148,342 153,352 163,357 153,362 148,372 143,362 133,357 143,352" fill="url(#accent-spark)" opacity="0.85" />
    <!-- Các hạt điểm xung nhịp tốc độ -->
    <circle cx="376" cy="180" r="3.5" fill="#FEF08A" />
    <circle cx="128" cy="288" r="3" fill="#38BDF8" />
  </g>
</svg>

