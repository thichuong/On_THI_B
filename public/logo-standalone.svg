<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- =========================================================================
       LOGO WEB APP (BẢN TRONG SUỐT / KHÔNG VIỀN NỀN)
       Dành cho header trong suốt, watermark, favicon hoặc chèn lên ảnh/banner
       ========================================================================= -->

  <defs>
    <!-- Quầng Sáng Tỏa Trung Tâm -->
    <radialGradient id="center-glow-s" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>

    <!-- Phối Cảnh Làn Đường -->
    <linearGradient id="road-surface-s" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="road-lane-left-s" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="road-lane-right-s" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Gradient Tia Sét -->
    <linearGradient id="bolt-glow-grad-s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <linearGradient id="bolt-light-facet-s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <linearGradient id="bolt-dark-facet-s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="accent-spark-s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Hiệu ứng Glow -->
    <filter id="bolt-neon-s" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="drop-shadow-s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Vầng sáng hào quang trung tâm -->
  <circle cx="256" cy="256" r="220" fill="url(#center-glow-s)" />

  <!-- Phối Cảnh Làn Đường Giao Thông -->
  <g id="road-perspective">
    <path d="M 120 460 L 222 230 L 290 230 L 392 460 Z" fill="url(#road-surface-s)" />
    <line x1="120" y1="460" x2="222" y2="230" stroke="url(#road-lane-left-s)" stroke-width="5" stroke-linecap="round" />
    <line x1="392" y1="460" x2="290" y2="230" stroke="url(#road-lane-right-s)" stroke-width="5" stroke-linecap="round" />
    
    <line x1="256" y1="440" x2="256" y2="395" stroke="#FDE047" stroke-width="6" stroke-linecap="round" opacity="0.9" />
    <line x1="256" y1="370" x2="256" y2="335" stroke="#FDE047" stroke-width="5" stroke-linecap="round" opacity="0.75" />
    <line x1="256" y1="315" x2="256" y2="290" stroke="#FDE047" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <line x1="256" y1="275" x2="256" y2="255" stroke="#FDE047" stroke-width="3" stroke-linecap="round" opacity="0.45" />
  </g>

  <!-- Quầng Hào Quang Tia Sét -->
  <g id="lightning-aura" filter="url(#bolt-neon-s)" opacity="0.9">
    <path d="M 284 64 L 168 256 L 254 242 L 228 448 L 344 218 L 264 230 Z" fill="url(#bolt-glow-grad-s)" opacity="0.65" />
  </g>

  <!-- Tia Sét 3D Chủ Đạo -->
  <g id="lightning-bolt" filter="url(#drop-shadow-s)">
    <path d="M 284 64 L 168 256 L 254 242 L 228 448 L 344 218 L 264 230 Z" 
          fill="url(#bolt-dark-facet-s)" 
          stroke="#FEF08A" 
          stroke-width="2" 
          stroke-linejoin="round" />

    <path d="M 284 64 L 168 256 L 254 242 L 228 448 Z" 
          fill="url(#bolt-light-facet-s)" />

    <line x1="284" y1="64" x2="254" y2="242" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    <line x1="254" y1="242" x2="228" y2="448" stroke="#FFF7ED" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Tia Lửa Năng Lượng -->
  <g id="sparks-and-energy">
    <polygon points="342,108 350,124 366,132 350,140 342,156 334,140 318,132 334,124" fill="url(#accent-spark-s)" />
    <polygon points="148,342 153,352 163,357 153,362 148,372 143,362 133,357 143,352" fill="url(#accent-spark-s)" opacity="0.85" />
    <circle cx="376" cy="180" r="3.5" fill="#FEF08A" />
    <circle cx="128" cy="288" r="3" fill="#38BDF8" />
  </g>
</svg>

